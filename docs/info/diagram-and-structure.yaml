3. DIRECTED DATA PIPELINE CONNECTIONS
--------------------------------------------------------------------------------
  Source Node           -> Target Node             | Description / Data Path
--------------------------------------------------------------------------------
  Text (Input)          -> Local Multimodal LLM    | Text prompt input
  Voice (STT)           -> Text (Input)            | Audio-to-text bidirectional link
  Voice (STT)           -> Audio Tone Gen          | Raw speech tone linkage
  Voice (STT)           -> Local Multimodal LLM    | Speech transcription stream
  Audio Tone Gen        -> Local Multimodal LLM    | Tone and emotion feature vectors
  Video/Image           -> Local Multimodal LLM    | Static frames and video feed
  Local Multimodal LLM  -> Text (Result)           | Token generation stream (WS/REST)
  Local Multimodal LLM  -> Synthesizer: TTS        | Text response to TTS pipeline
  Local Multimodal LLM  -> Vocal -> Lip Sync       | Phoneme / expression context
  Local Multimodal LLM  -> Animations & Rig        | Rig motion triggers
  Local Multimodal LLM  -> Image (Result)          | Visual search and query processing
  Synthesizer: TTS      -> Virtual Audio           | Synthesized raw audio buffer
  Virtual Audio         -> Voice (Result)          | Audio pass-through (VB-Cable)
  Voice (Result)        -> Output                  | Transformed voice stream -> Speakers
  Vocal -> Lip Sync     -> Animations & Rig        | Real-time viseme blendshape offsets
  Animations & Rig      -> Output                  | Rendered WebGL output -> UI Viewport
  Text (Result)         -> Output                  | Text chat payload -> Electron/Web UI
  Image (Result)        -> Output                  | Processed image view -> UI Viewport