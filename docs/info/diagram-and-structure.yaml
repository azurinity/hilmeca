# ==============================================================================
# HILM-ECA ARCHITECTURE TOPOLOGY & DATA FLOW SPECIFICATION
# ==============================================================================

1. SYSTEM STAGES & NODE SPECIFICATIONS
--------------------------------------------------------------------------------
[INPUT: Sensory & Perception]
  - Node: Text
      - Technology: Electron / Web UI[cite: 1, 2]
      - Connected To: Voice (STT), Local Multimodal LLM

  - Node: Voice (STT)
      - Technology: Faster-Whisper @ int8[cite: 2]
      - Connected To: Text (Input), Audio Tone Gen, Local Multimodal LLM

  - Node: Audio Tone Gen
      - Technology: Wav2Vec2 CPU[cite: 2]
      - Connected To: Voice (STT), Local Multimodal LLM

  - Node: Video/Image
      - Technology: Live video feed or Image[cite: 2]
      - Connected To: Local Multimodal LLM

[CORE: Brain & Cognition]
  - Node: Local Multimodal LLM
      - Format: 4-bit native GGUF[cite: 2]
      - Engine: Ollama LLM engine[cite: 1, 2]
      - Target Models:
          * qwen3-vl:8b[cite: 2]
          * qwen3.5:9b[cite: 2]
      - Connected To:
          * Text (Result)
          * Synthesizer: TTS
          * Vocal -> Lip Sync
          * Animations & Rig
          * Image (Result)

[RESULT: Processing & Expression]
  - Node: Text (Result)
      - Protocol/Interface: Local WebSocket rest API[cite: 1]
      - Connected To: Output

  - Node: Synthesizer: TTS
      - Engine: Kokoro-82M[cite: 2]
      - Connected To: Virtual Audio

  - Node: Virtual Audio
      - Interface: VBCable (Output & Input)[cite: 2]
      - Connected To: Voice (Result)

  - Node: Voice (Result)
      - Engine: w-okada VCClient: RVC V2[cite: 2]
      - Connected To: Output

  - Node: Vocal -> Lip Sync
      - Engine: wawa-lipsync[cite: 2]
      - Connected To: Animations & Rig

  - Node: Animations & Rig
      - Rendering Framework: @pixiv/three-vrm + Three.js[cite: 2]
      - Connected To: Output

  - Node: Image (Result)
      - Scope: Image search & vision[cite: 2]
      - Connected To: Output

  - Node: Output
      - Enclosure Targets:
          * Electron Forge UI[cite: 1, 2]
          * Web UI[cite: 1, 2]
          * Speakers[cite: 2]


